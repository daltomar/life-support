<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ track_title }}</title>
  <link rel="stylesheet" href="/static/player.css">
</head>
<body>
  <div class="player">
    <div class="track-title">{{ track_title }}</div>
    <div class="track-meta">{{ track_meta }}</div>
    <div class="controls">
      <button class="btn" id="btn" aria-label="Play">&#9654;</button>
      <div class="scrubber" id="scrubber">
        <div class="scrubber-fill" id="fill"></div>
      </div>
      <span class="time" id="time">0:00</span>
    </div>
  </div>

  <audio id="audio" preload="metadata" src="/media/{{ track_file|urlencode }}"></audio>

  <script src="/static/player.js"></script>
</body>
</html>
