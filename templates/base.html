<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Life Support Records{% endblock %}</title>
  <link rel="preload" href="/static/fonts/creepster-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div class="root">
    <header>
      <div class="wordmark">
        <span class="wordmark-name font-display">LIFE SUPPORT RECORDS</span>
        <span class="wordmark-slogan">AMATEUR - DIY - INDEPENDENT - SLOPPY (sometimes)</span>
      </div>
      <button class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false">
        <span></span>
        <span></span>
      </button>
    </header>

    <nav aria-label="Main">
      <button class="nav-close" id="nav-close" aria-label="Close menu">&#10005;</button>
      <div>
       
        <ul class="nav-list font-display">
          <li>
            <a href="/" {% if active_nav.as_str() == "start" %}aria-current="page"{% endif %}>
              <span class="nav-num">00</span>
              <span class="nav-label-text">Start</span>
              <span class="nav-dot" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a href="/artists" {% if active_nav.as_str() == "artists" %}aria-current="page"{% endif %}>
              <span class="nav-num">01</span>
              <span class="nav-label-text">Artists</span>
              <span class="nav-dot" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a href="/releases" {% if active_nav.as_str() == "releases" %}aria-current="page"{% endif %}>
              <span class="nav-num">02</span>
              <span class="nav-label-text">Releases</span>
              <span class="nav-dot" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a href="/listen" {% if active_nav.as_str() == "listen" %}aria-current="page"{% endif %}>
              <span class="nav-num">03</span>
              <span class="nav-label-text">Listen</span>
              <span class="nav-dot" aria-hidden="true"></span>
            </a>
          </li>
        </ul>
      </div>

      <div class="now-playing">
        <div class="now-playing-label">NOW PLAYING</div>
        <div class="player-row">
          <div class="player-cover" aria-hidden="true"></div>
          <div class="player-info">
            <div class="player-title">—</div>
            <div class="player-artist">—</div>
          </div>
        </div>
        <div class="player-controls">
          <button class="player-skip player-prev" aria-label="Previous track" disabled>
            <svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><rect x="0" y="0" width="2" height="14"/><polygon points="12,0 3,7 12,14"/></svg>
          </button>
          <button class="player-btn" id="play-btn" aria-label="Play">
            <svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><polygon points="0,0 12,7 0,14"/></svg>
          </button>
          <button class="player-skip player-next" aria-label="Next track" disabled>
            <svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><rect x="10" y="0" width="2" height="14"/><polygon points="0,0 9,7 0,14"/></svg>
          </button>
        </div>
        <div class="player-progress">
          <span class="player-time" id="player-time">0:00</span>
          <div class="player-track" id="player-track">
            <div class="player-fill" id="player-fill"></div>
          </div>
          <span class="player-duration" id="player-dur">0:00</span>
        </div>
        <div class="player-volume">
          <button class="player-skip" id="player-mute" aria-label="Mute">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><polygon points="0,4.5 3,4.5 7,1 7,13 3,9.5 0,9.5"/><rect x="9" y="5" width="1.5" height="4"/><rect x="12" y="3" width="1.5" height="8"/></svg>
          </button>
          <input class="player-volume-slider" id="player-volume-slider" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
        </div>
      </div>
    </nav>

    <main class="{% block main_class %}{% endblock %}"{% block main_style %}{% endblock %}>
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Docked player (mobile only) -->
  <div class="docked-player">
    <div class="docked-progress" id="docked-progress"></div>
    <div class="player-cover"></div>
    <div class="player-info">
      <div class="player-title">—</div>
      <div class="player-artist">—</div>
    </div>
    <div class="player-controls">
      <button class="player-skip player-prev" aria-label="Previous track" disabled>
        <svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><rect x="0" y="0" width="2" height="14"/><polygon points="12,0 3,7 12,14"/></svg>
      </button>
      <button class="player-btn" onclick="document.getElementById('play-btn').click()" aria-label="Play">
        <svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><polygon points="0,0 12,7 0,14"/></svg>
      </button>
      <button class="player-skip player-next" aria-label="Next track" disabled>
        <svg width="12" height="14" viewBox="0 0 12 14" fill="currentColor" aria-hidden="true"><rect x="10" y="0" width="2" height="14"/><polygon points="0,0 9,7 0,14"/></svg>
      </button>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>
  <script src="/static/app.js"></script>
</body>
</html>
