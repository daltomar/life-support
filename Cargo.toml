[package]
name = "life-support"
version = "0.1.0"
edition = "2021"

[dependencies]
askama = "0.12"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
